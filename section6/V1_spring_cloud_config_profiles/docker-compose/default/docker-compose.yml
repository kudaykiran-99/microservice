services:
  #we are using the rabbitmq spring cloud buss without calling the refresh api manually after updateing the properties    .
  rabbit:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - udaybank
  springconfigserver:
    image: "udaychowdary/springconfigserver:s6"
    container_name: accounts-ms
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --slient localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
#to test liveness and readness is true config service is up or not if not restart config service again because other service are dependent on the config service to access the properties . services linke the accounts, cards, loans
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - udaybank
  accounts:
    image: "udaychowdary/accounts:s6"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
      springconfigserver:
        condition: service_healthy
      #its like adding condtiton to accounts to start after the spring config service is up and running. because acc was depended on the config to access the properties
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - udaybank
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_CONFIG_IMPORT: "configserver:http:springconfigserver:8071/"
      SPRING_PROFILES_ACTIVE: default
#    environment: is accouts cervice is connect to the config server.
  loans:
    image: "udaychowdary/loans:s6"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      springconfigserver:
        condition: service_healthy
      #its like adding condtiton to accounts to start after the spring config service is up and running. because acc was depended on the config to access the properties
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - udaybank
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_CONFIG_IMPORT: "configserver:http:springconfigserver:8071/"
      SPRING_PROFILES_ACTIVE: default

  cards:
    image: "udaychowdary/cards:s6"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      springconfigserver:
        condition: service_healthy
      #its like adding condtiton to accounts to start after the spring config service is up and running. because acc was depended on the config to access the properties

    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - udaybank
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_CONFIG_IMPORT: "configserver:http:springconfigserver:8071/"
      SPRING_PROFILES_ACTIVE: default

networks:
  udaybank:
    driver: bridge

#this file we can write any service to create the container at a time of all images like the loans, card and acconunts

#network is create bridge with name udaybank bettwen the all service to inter communicate each other


#to run this compose file . root to accounts . docker compose up