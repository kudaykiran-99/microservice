server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
# now we telling the spring that we are importing two qa and prod yml fiels and activeing one file or two fiels at a time. if we not active any yml it will take default yml file

  config:
    import:
      - "application_qa.yml"
      - "apllication_prod.yml"
  profiles:
    active:
      - "qa"

#now we will deploy the appilcation and creating the image no need to create image for every env. just create yml fiels diffrent env and active in the default yml fiel is called profiels


#value declare in the application properties and fetch into class by using value.
build:
  version: "3.0"

#envirolment to fetch value from the local system. in accounts controller

#we can fetch multiple propertirs at a time by using configuration properties by declareing in the yaml fiel . prifix should be same. will create the record class to mapp this fields to application to use any where into appl

